<!DOCTYPE html>
<html lang="en-IN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — TV Fix Pro</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#6D4AF5">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            color: #1C1636;
            background: #EEEBFA;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 560px;
            text-align: center;
            background: rgba(255, 255, 255, .62);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 28px;
            padding: 48px 32px;
            box-shadow: 0 30px 60px rgba(70, 60, 140, .16);
        }

        .code {
            font-family: 'Space Mono', ui-monospace, monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #6D4AF5;
        }

        h1 {
            font-family: 'Sora', sans-serif;
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 800;
            letter-spacing: -.03em;
            line-height: 1.05;
            margin: 10px 0 12px;
        }

        p {
            color: #5D5878;
            font-size: 16.5px;
            line-height: 1.6;
            font-weight: 500;
            margin: 0 auto 26px;
            max-width: 420px;
        }

        .row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 26px;
            border-radius: 999px;
            font-size: 15.5px;
            font-weight: 700;
            text-decoration: none;
            transition: transform .18s ease, filter .18s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.05);
        }

        .primary {
            background: linear-gradient(135deg, #6D4AF5, #4E2FD6);
            color: #fff;
            box-shadow: 0 14px 30px rgba(109, 74, 245, .34);
        }

        .ghost {
            background: rgba(255, 255, 255, .6);
            color: #1C1636;
            border: 1px solid rgba(255, 255, 255, .85);
        }

        a:focus-visible {
            outline: 3px solid #4E2FD6;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion:reduce) {
            .btn {
                transition: none;
            }
            .btn:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="code">Error 404</div>
        <h1>This page took a blank screen.</h1>
        <p>The link you followed doesn't exist — but your TV problem still does. Let's get that sorted.</p>
        <div class="row">
            <a class="btn primary" href="/">← Back to TV Fix Pro</a>
            <a class="btn ghost" href="tel:+919740696179">📞 Call +91 97406 96179</a>
        </div>
    </main>
</body>

</html>
